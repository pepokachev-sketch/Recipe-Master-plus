name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-capacitor
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'recipes_library.json'
      - 'src/**'
      - 'icons/**'
      - 'android-icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-android-web.mjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Recipe Master Plus APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run existing data and backup tests
        run: npm run test:data-manager

      - name: Prepare local web app bundle
        run: npm run android:prepare-web

      - name: Generate Android project
        run: npx cap add android

      - name: Install Recipe Master Plus launcher icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp android-icons/ic_launcher.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp android-icons/ic_launcher.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          # Use the supplied raster artwork rather than Capacitor's generated adaptive placeholder.
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set APK version 4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          content, code_count = re.subn(r'(?m)^\s*versionCode\s+\d+\s*
, '        versionCode 4', content, count=1)
          content, name_count = re.subn(r'(?m)^\s*versionName\s+"[^"]+"\s*
, '        versionName "4"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")
          gradle.write_text(content)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name version 4 APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Recipe-Master-Plus-v4.apk

      - name: Upload version 4 APK
        uses: actions/upload-artifact@v4
        with:
          name: recipe-master-plus-v4-apk
          path: android/app/build/outputs/apk/debug/Recipe-Master-Plus-v4.apk
          if-no-files-found: error
          retention-days: 14
