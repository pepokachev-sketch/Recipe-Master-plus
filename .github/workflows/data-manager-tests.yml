name: Data manager tests

on:
  push:
    branches:
      - work/nav-sync-v18-3-2026-10-31
  pull_request:
    branches:
      - main

jobs:
  test-data-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:data-manager
